    <script>
            // Simple micro-interaction for password visibility
            const togglePass = document.querySelector('button span:contains("visibility")');
            if (togglePass) {
                togglePass.parentElement.addEventListener('click', () => {
                    const input = document.getElementById('password');
                    const isPassword = input.type === 'password';
                    input.type = isPassword ? 'text' : 'password';
                    togglePass.textContent = isPassword ? 'visibility_off' : 'visibility';
                });
            }
    
            // Custom selector helper for jQuery-like contains
            window.addEventListener('DOMContentLoaded', () => {
                const buttons = document.querySelectorAll('button');
                buttons.forEach(btn => {
                    const icon = btn.querySelector('.material-symbols-outlined');
                    if (icon && icon.textContent === 'visibility') {
                        btn.addEventListener('click', () => {
                            const input = document.getElementById('password');
                            if (input.type === 'password') {
                                input.type = 'text';
                                icon.textContent = 'visibility_off';
                            } else {
                                input.type = 'password';
                                icon.textContent = 'visibility';
                            }
                        });
                    }
                });
            });
        </script>
